# Who gets triaged vLLM issues and PRs, and which ones.
#
# To change your rules, edit your entry and open a PR. It takes effect about
# 5 minutes after the PR merges (the triage worker reads this file from
# `main`). To try a change first, use "Rules" on ci.vllm.ai/triage: it
# previews what a draft would have matched over the last 30 days and gives
# you the YAML to paste here.
#
# How matching works (full details in triage/docs/data-model.md):
#   - An item matches you if ANY of areas / hardware / models / paths /
#     keywords matches, and nothing in `exclude` does.
#   - `types` only narrows: if set, the item must be one of those types.
#   - models: lowercase globs against the model names Claude extracts,
#     e.g. "qwen3.5*". paths: globs against files a PR changes; "dir/**"
#     means anything under dir. keywords: case-insensitive, in the title or
#     summary.
#   - If several people match, the one with more matching criteria wins,
#     then whoever has the most room under capacity_per_week.
#   - You only get items scoring at least min_score (page band is 70+,
#     route band 40+). Items in the page band ignore capacity.
#
# Allowed values:
#   areas: scheduler kv_cache attention moe quantization distributed
#     model_loading models multimodal spec_decode lora frontend_api
#     tool_calling structured_output compilation kernels sampling tokenizer
#     engine_core disagg kv_connector rocm tpu cpu xpu build_install ci docs
#     benchmarks performance memory other
#   hardware: H100 H200 B200 B300 GB200 GB300 A100 L40S L4 RTX MI300X MI325X
#     MI355X TPU Gaudi CPU_x86 CPU_arm Apple XPU other_nvidia other_amd other
#   types: bug regression perf_regression feature performance question
#     usage docs ci refactor other spam
#   notify_mode: immediate | digest | off  (Slack is off for now)
#
# Validate locally: cd triage && uv run python -m triage.maintainers check config/maintainers.yaml

maintainers:
  # Thien Tran. Draft from vLLM history (2026-11-12) for them to review:
  # CODEOWNERS for qwen4_exp, kimi_k3 KDA, GDN CuTe-DSL, BF16x3 router GEMM,
  # CuTe-DSL GEMM-RS/AR, cute_utils; recent PRs are NVIDIA/Blackwell
  # performance on Qwen4Exp, Qwen3.5, Kimi-K3, MiniMax-M3, DeepGEMM MegaMoE.
  - github_login: gau-nernst
    min_score: 40          # the route threshold; raise it to see only bigger items
    capacity_per_week: 8
    notify_mode: digest
    rules:
      # Owned models only. Qwen3.5/3.8 are left out on purpose (too broad);
      # their GDN kernel work is covered by the paths and keywords below.
      models: ["qwen4*", "kimi-k3*", "kimi*k3*", "minimax-m3*"]
      paths:
        - "vllm/models/qwen4_exp/**"
        - "vllm/models/kimi_k3/nvidia/**"
        - "vllm/models/minimax_m3/nvidia/**"
        - "vllm/model_executor/layers/mamba/**"
        - "vllm/model_executor/layers/fused_moe/router/**"
        - "vllm/model_executor/kernels/linear/cute_dsl/**"
        - "vllm/cute_utils/**"
        - "vllm/model_executor/warmup/**"
      keywords: ["gdn", "gated delta", "megamoe", "deepgemm", "router gemm", "cute dsl", "cutedsl", "kda"]
      exclude:
        types: [question, usage, docs]
        hardware: [MI300X, MI325X, MI355X, other_amd, TPU, Gaudi, XPU, CPU_x86, CPU_arm, Apple]
      natural_language: >-
        NVIDIA (Hopper/Blackwell) performance and correctness for new MoE and
        hybrid-attention models, and the kernels behind them (GDN, KDA,
        DeepGEMM MegaMoE, router GEMM, CuTe DSL).
