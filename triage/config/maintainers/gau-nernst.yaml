# Thien Tran. Drafted 2026-11-12 from their vLLM history; edit freely.
#
# Who gets what is judged by Claude from your recent vLLM PRs (authored and
# reviewed, refreshed daily) plus the notes below. Write the notes however
# you like. `rules` is optional: use it only for hard limits or "always send me".
github_login: gau-nernst
min_score: 40
capacity_per_week: 8
notify_mode: digest

notes: |
  I work on NVIDIA (Hopper/Blackwell) performance and correctness for new MoE
  and hybrid-attention models (Qwen4Exp, Qwen3.5/3.8, Kimi-K3, MiniMax-M3) and
  the kernels behind them: GDN, KDA, DeepGEMM MegaMoE, the BF16x3 router GEMM,
  CuTe DSL kernels, FP8/FP4 activation quant (per_token_group_quant, Humming),
  and kernel warmup.
  Don't send me: AMD/ROCm, TPU or CPU issues; model loading or GGUF; frontend
  or API questions.

rules:
  exclude:
    hardware: [MI300X, MI325X, MI355X, other_amd, TPU, Gaudi, XPU, CPU_x86, CPU_arm, Apple]
