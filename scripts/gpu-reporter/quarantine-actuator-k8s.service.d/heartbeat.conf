# The off-host heartbeat, as a drop-in rather than an edit of
# quarantine-actuator-k8s.service: reinstalling the unit (whose ExecStart
# pins --dry-run) then touches neither the chain nor a live actuator's own
# command line.

[Unit]
# After each completed poll; a poll that never finishes exits 1 and emits
# nothing, and the CloudWatch alarm on the gap is the only pager a control
# plane has.
OnSuccess=quarantine-actuator-heartbeat.service

[Service]
# A completed poll with per-node errors exits 3: count it as success so the
# OnSuccess= heartbeat still fires; only a poll that never finished (exit 1)
# silences it. Not 2: Python and argparse exit 2 on their own failures.
SuccessExitStatus=3
