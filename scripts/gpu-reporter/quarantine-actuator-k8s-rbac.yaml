# RBAC for the quarantine actuator (quarantine-actuator-k8s.py), the tainter.
# Separate from the reader (gpu-reporter-k8s-rbac.yaml): only this identity
# can change nodes. Known limit: `nodes patch` can't be narrowed to our taint
# or to spec.unschedulable; accepted for the pilot.
#
# Apply once per cluster, then mint a kubeconfig for the ServiceAccount and
# install it on the control plane that runs quarantine-actuator-k8s.timer as
# /etc/gpu-reporter/quarantine-actuator-k8s.kubeconfig, owned by root, mode
# 0600 (it holds a token that can cordon every node). Never use
# /etc/kubernetes/admin.conf.
#
#   kubectl apply -f quarantine-actuator-k8s-rbac.yaml
#   TOKEN=$(kubectl -n gpu-operator get secret quarantine-actuator-token \
#     -o jsonpath='{.data.token}' | base64 -d)
#   KC=/etc/gpu-reporter/quarantine-actuator-k8s.kubeconfig
#   sudo install -m 0600 -o root -g root /dev/null "$KC"
#   sudo kubectl --kubeconfig "$KC" config set-cluster <cluster> \
#     --server=https://<api-server>:6443 \
#     --certificate-authority=/etc/kubernetes/pki/ca.crt --embed-certs=true
#   sudo kubectl --kubeconfig "$KC" config set-credentials quarantine-actuator --token="$TOKEN"
#   sudo kubectl --kubeconfig "$KC" config set-context quarantine-actuator \
#     --cluster=<cluster> --user=quarantine-actuator
#   sudo kubectl --kubeconfig "$KC" config use-context quarantine-actuator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quarantine-actuator
  namespace: gpu-operator
---
apiVersion: v1
kind: Secret
metadata:
  name: quarantine-actuator-token
  namespace: gpu-operator
  annotations:
    kubernetes.io/service-account.name: quarantine-actuator
type: kubernetes.io/service-account-token
---
# nodes get/list - read cordon and taints; patch - cordon/uncordon
# (spec.unschedulable), add/remove the vllm.ci/quarantine taint, and the
# vllm.ci/quarantine-cordoned annotation that marks a cordon as ours.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: quarantine-actuator
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: quarantine-actuator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: quarantine-actuator
subjects:
  - kind: ServiceAccount
    name: quarantine-actuator
    namespace: gpu-operator
---
# CI job pods on a quarantined node ("drained" once none is Running/Pending).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quarantine-actuator
  namespace: buildkite
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quarantine-actuator
  namespace: buildkite
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: quarantine-actuator
subjects:
  - kind: ServiceAccount
    name: quarantine-actuator
    namespace: gpu-operator
---
# The return check: a one-off pod per resolved node, read for its phase and
# log, then deleted. It runs in its own namespace, so the actuator can't
# create a pod under a service account worth more than the empty default
# one there. The pod needs SYS_ADMIN for dcgmi, so the namespace allows
# privileged pods; the admission policy below allows only the check's shape.
apiVersion: v1
kind: Namespace
metadata:
  name: vllm-quarantine-verify
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quarantine-actuator-verify
  namespace: vllm-quarantine-verify
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quarantine-actuator-verify
  namespace: vllm-quarantine-verify
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: quarantine-actuator-verify
subjects:
  - kind: ServiceAccount
    name: quarantine-actuator
    namespace: gpu-operator
---
# Every pod in the namespace must look like the return check: NVIDIA's DCGM
# image, on a GPU node, one container, SYS_ADMIN as its only added
# capability, not privileged, no volumes, no host namespaces and no service
# account token. It doesn't pin the command: whoever holds the actuator's
# token can run any command in that image with SYS_ADMIN on a GPU node, which
# is the same nodes the token can already cordon.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vllm-quarantine-verify
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        has(object.spec.nodeName) &&
        (object.spec.nodeName.startsWith('inf-4x8h100-') ||
          object.spec.nodeName.startsWith('dgxb200-')) &&
        size(object.spec.containers) == 1 &&
        !has(object.spec.initContainers) &&
        !has(object.spec.ephemeralContainers) &&
        object.spec.containers[0].image.startsWith('nvcr.io/nvidia/cloud-native/dcgm:') &&
        !has(object.spec.volumes) &&
        !has(object.spec.containers[0].volumeMounts) &&
        !has(object.spec.hostNetwork) && !has(object.spec.hostPID) && !has(object.spec.hostIPC) &&
        has(object.spec.automountServiceAccountToken) && !object.spec.automountServiceAccountToken &&
        (!has(object.spec.containers[0].securityContext) ||
          ((!has(object.spec.containers[0].securityContext.privileged) ||
            object.spec.containers[0].securityContext.privileged == false) &&
           (!has(object.spec.containers[0].securityContext.capabilities) ||
            !has(object.spec.containers[0].securityContext.capabilities.add) ||
            object.spec.containers[0].securityContext.capabilities.add.all(c, c == 'SYS_ADMIN'))))
      message: Only the quarantine return check runs in vllm-quarantine-verify.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: vllm-quarantine-verify
spec:
  policyName: vllm-quarantine-verify
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: vllm-quarantine-verify
