name: Python backend tests

on:
  pull_request:
    paths:
      - ".github/workflows/python-backend-tests.yml"
      - "alerting/**"
      - "deploy/aws/**"
      - "migrations/**"
      - "scripts/gpu-reporter/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux, x64, vllm-runners]
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"

      - name: Install packages with dev dependencies
        run: python -m pip install -e "./alerting[dev]" -e "./migrations[dev]"

      - name: Run tests
        working-directory: alerting
        run: python -m pytest

      - name: Run AWS deployment tests
        run: python -m pytest deploy/aws/tests

      - name: Run migration tests
        working-directory: migrations
        run: python -m pytest

      - name: Run GPU reporter tests
        run: python -m pytest scripts/gpu-reporter/tests

      - name: Type check
        working-directory: alerting
        run: python -m mypy __init__.py analyzer.py commands.py control.py cutover.py fast_ci.py full_ci.py infra.py kimi.py main_ci.py main_ci_analysis.py memory.py migration.py ports.py postgres.py retention.py runtime.py slack.py worker.py tests

      - name: Type check migrations
        working-directory: migrations
        run: python -m mypy __init__.py runner.py tests

      - name: Lint
        working-directory: alerting
        run: python -m ruff check .

      - name: Lint migrations
        working-directory: migrations
        run: python -m ruff check .
