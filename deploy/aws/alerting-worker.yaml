AWSTemplateFormatVersion: '2010-09-09'
Description: Disposable single-instance runtime for vLLM CI alerting

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  InstanceType:
    Type: String
    Default: t3.small
  RepositoryUrl:
    Type: String
    Default: https://github.com/vllm-project/vllm-dashboard.git
  RepositoryRef:
    Type: String
    Default: main
  WorkerSecretArn:
    Type: String
    Description: Full ARN of a JSON secret containing runtime environment variables
    AllowedPattern: 'arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+-[A-Za-z0-9]{6}'
    ConstraintDescription: Must be a full Secrets Manager ARN including its six-character suffix; use describe-secret --query ARN.
  GitHubReadOnlySecretArn:
    Type: String
    Description: Full ARN of a JSON secret containing a read-only GITHUB_TOKEN
    AllowedPattern: 'arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+-[A-Za-z0-9]{6}'
    ConstraintDescription: Must be a full Secrets Manager ARN including its six-character suffix; use describe-secret --query ARN.
  KimiReasoningEffort:
    Type: String
    Description: Thinking effort for the Full CI Kimi analyzer
    Default: high
    AllowedValues:
      - low
      - high
      - max
  KimiMainCIReasoningEffort:
    Type: String
    Description: >-
      Thinking effort for the Main CI failure analyzer; independent of
      KimiReasoningEffort
    Default: high
    AllowedValues:
      - low
      - high
      - max
  HeartbeatAlertEmail:
    Type: String
    Default: ''
    Description: >-
      Email address that the off-worker heartbeat alarms notify through SNS.
      Empty creates the topic and alarms without a subscriber. SNS emails a
      confirmation link that must be clicked once.

Conditions:
  HasHeartbeatEmail:
    Fn::Not:
      - Fn::Equals: [{Ref: HeartbeatAlertEmail}, '']

Resources:
  CheckpointBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      # SSM Session Manager / Run Command access for in-place ops (code
      # updates, health checks). The security group already allows the 443
      # egress the agent needs; the instance stays without SSH ingress.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: AlertingWorkerCheckpointAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  Fn::GetAtt: [CheckpointBucket, Arn]
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  Fn::Sub:
                    - ${BucketArn}/*
                    - BucketArn:
                        Fn::GetAtt: [CheckpointBucket, Arn]
        - PolicyName: AlertingWorkerHeartbeat
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: VllmAlerting
        - PolicyName: AlertingWorkerSecretAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - Ref: WorkerSecretArn
                  - Ref: GitHubReadOnlySecretArn

  WorkerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - Ref: WorkerRole

  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Egress-only access for the vLLM alerting worker
      VpcId:
        Ref: VpcId
      SecurityGroupEgress:
        - Description: HTTPS APIs and package installation
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: Direct Postgres
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0
        - Description: Supavisor transaction pooler
          IpProtocol: tcp
          FromPort: 6543
          ToPort: 6543
          CidrIp: 0.0.0.0/0

  WorkerInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId:
        Ref: AmiId
      InstanceType:
        Ref: InstanceType
      IamInstanceProfile:
        Ref: WorkerInstanceProfile
      SecurityGroupIds:
        - Ref: WorkerSecurityGroup
      SubnetId:
        Ref: SubnetId
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeType: gp3
            VolumeSize: 16
      Tags:
        - Key: Name
          Value: vllm-alerting-worker
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              set -euo pipefail
              dnf install -y git python3.12 python3.12-pip
              install -d -m 0755 /opt/alerting
              git clone --depth 1 --branch '${RepositoryRef}' '${RepositoryUrl}' /opt/alerting/source
              /opt/alerting/source/deploy/aws/install.sh '${BucketName}' '${WorkerSecret}' '${GitHubSecret}' '${KimiEffort}' '${KimiMainCIEffort}'
            - BucketName:
                Ref: CheckpointBucket
              WorkerSecret:
                Ref: WorkerSecretArn
              GitHubSecret:
                Ref: GitHubReadOnlySecretArn
              KimiEffort:
                Ref: KimiReasoningEffort
              KimiMainCIEffort:
                Ref: KimiMainCIReasoningEffort

  # Off-worker heartbeat: units put a VllmAlerting/Heartbeat datapoint after
  # each successful run (bin/emit-heartbeat, chained from each unit's
  # OnSuccess=). Gaps in the data count as zero, so a dead timer, a dead
  # instance, or a worker that cannot load its secret all alarm, and delivery
  # goes SNS -> email without the worker, its database or secret. Names carry
  # the stack name so a replacement stack never clashes on names; the metric
  # itself is per account and region (one worker each), so while an old and a
  # replacement worker are both up, each holds the other stack's alarms at OK.
  HeartbeatTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName:
        Fn::Sub: ${AWS::StackName}-heartbeat

  HeartbeatSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasHeartbeatEmail
    Properties:
      TopicArn:
        Ref: HeartbeatTopic
      Protocol: email
      Endpoint:
        Ref: HeartbeatAlertEmail

  HeartbeatControlAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${AWS::StackName}-heartbeat-control
      AlarmDescription: >-
        No successful control run for 15 minutes. Check the worker's timers and
        its secret (Operations Handbook, Off-worker heartbeat).
      # FILL(m1, 0) makes every period a real datapoint, so CloudWatch never
      # reaches back past EvaluationPeriods for an older heartbeat that would
      # hold the alarm at OK after the job went silent. The count also leaves
      # one full bucket of margin: if FILL counts the in-progress bucket as a
      # zero, the alarm still needs (N-1) silent periods, which outlasts one
      # timed-out run plus one successful run at the durations we observe.
      Metrics:
        - Id: m1
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: VllmAlerting
              MetricName: Heartbeat
              Dimensions:
                - Name: Job
                  Value: control
            Period: 300
            Stat: Sum
        - Id: e1
          Expression: FILL(m1, 0)
          Label: Heartbeats per 5 minutes
          ReturnData: true
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - Ref: HeartbeatTopic
      OKActions:
        - Ref: HeartbeatTopic

  HeartbeatFastCiAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${AWS::StackName}-heartbeat-fast-ci
      AlarmDescription: >-
        No successful fast-ci run for 50 minutes. Check the worker's timers and
        its secret (Operations Handbook, Off-worker heartbeat).
      # FILL(m1, 0) makes every period a real datapoint, so CloudWatch never
      # reaches back past EvaluationPeriods for an older heartbeat that would
      # hold the alarm at OK after the job went silent. The count also leaves
      # one full bucket of margin: if FILL counts the in-progress bucket as a
      # zero, the alarm still needs (N-1) silent periods, which outlasts one
      # timed-out run plus one successful run at the durations we observe.
      Metrics:
        - Id: m1
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: VllmAlerting
              MetricName: Heartbeat
              Dimensions:
                - Name: Job
                  Value: fast-ci
            Period: 300
            Stat: Sum
        - Id: e1
          Expression: FILL(m1, 0)
          Label: Heartbeats per 5 minutes
          ReturnData: true
      EvaluationPeriods: 10
      DatapointsToAlarm: 10
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - Ref: HeartbeatTopic
      OKActions:
        - Ref: HeartbeatTopic

  HeartbeatMainCiAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${AWS::StackName}-heartbeat-main-ci
      AlarmDescription: >-
        No successful main-ci run for 25 minutes. Check the worker's timers and
        its secret (Operations Handbook, Off-worker heartbeat).
      # FILL(m1, 0) makes every period a real datapoint, so CloudWatch never
      # reaches back past EvaluationPeriods for an older heartbeat that would
      # hold the alarm at OK after the job went silent. The count also leaves
      # one full bucket of margin: if FILL counts the in-progress bucket as a
      # zero, the alarm still needs (N-1) silent periods, which outlasts one
      # timed-out run plus one successful run at the durations we observe.
      Metrics:
        - Id: m1
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: VllmAlerting
              MetricName: Heartbeat
              Dimensions:
                - Name: Job
                  Value: main-ci
            Period: 300
            Stat: Sum
        - Id: e1
          Expression: FILL(m1, 0)
          Label: Heartbeats per 5 minutes
          ReturnData: true
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - Ref: HeartbeatTopic
      OKActions:
        - Ref: HeartbeatTopic

  HeartbeatInfraAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${AWS::StackName}-heartbeat-infra
      AlarmDescription: >-
        No successful infra run for 35 minutes. Check the worker's timers and
        its secret (Operations Handbook, Off-worker heartbeat).
      # FILL(m1, 0) makes every period a real datapoint, so CloudWatch never
      # reaches back past EvaluationPeriods for an older heartbeat that would
      # hold the alarm at OK after the job went silent. The count also leaves
      # one full bucket of margin: if FILL counts the in-progress bucket as a
      # zero, the alarm still needs (N-1) silent periods, which outlasts one
      # timed-out run plus one successful run at the durations we observe.
      Metrics:
        - Id: m1
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: VllmAlerting
              MetricName: Heartbeat
              Dimensions:
                - Name: Job
                  Value: infra
            Period: 300
            Stat: Sum
        - Id: e1
          Expression: FILL(m1, 0)
          Label: Heartbeats per 5 minutes
          ReturnData: true
      EvaluationPeriods: 7
      DatapointsToAlarm: 7
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - Ref: HeartbeatTopic
      OKActions:
        - Ref: HeartbeatTopic

  HeartbeatH200PauserAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${AWS::StackName}-heartbeat-h200-pauser
      AlarmDescription: >-
        No successful h200-pauser run for 20 minutes. Check the worker's timers
        and its secret (Operations Handbook, Off-worker heartbeat).
      # FILL(m1, 0) makes every period a real datapoint, so CloudWatch never
      # reaches back past EvaluationPeriods for an older heartbeat that would
      # hold the alarm at OK after the job went silent. The count also leaves
      # one full bucket of margin: if FILL counts the in-progress bucket as a
      # zero, the alarm still needs (N-1) silent periods, which outlasts one
      # timed-out run plus one successful run at the durations we observe.
      Metrics:
        - Id: m1
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: VllmAlerting
              MetricName: Heartbeat
              Dimensions:
                - Name: Job
                  Value: h200-pauser
            Period: 300
            Stat: Sum
        - Id: e1
          Expression: FILL(m1, 0)
          Label: Heartbeats per 5 minutes
          ReturnData: true
      EvaluationPeriods: 4
      DatapointsToAlarm: 4
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - Ref: HeartbeatTopic
      OKActions:
        - Ref: HeartbeatTopic

  # The k8s quarantine actuators run on the cluster control planes, not on
  # this worker: each control plane emits Job=quarantine-actuator-<cluster>
  # after a completed poll (scripts/gpu-reporter/quarantine-actuator-heartbeat.service;
  # a poll that finishes with per-node errors exits 2 and still emits, only a
  # poll that never finished emits nothing) with per-host static credentials
  # scoped to PutMetricData in this namespace. The window is at least 15
  # minutes of silence: it outlasts one timed-out run (2 min) and a brief
  # endpoint blip, while a dead timer, a dead control plane or dead
  # credentials still page fast — nothing else on a control plane can.
  HeartbeatQuarantineActuatorH100Alarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${AWS::StackName}-heartbeat-quarantine-actuator-h100
      AlarmDescription: >-
        No completed h100 quarantine actuator poll for at least 15 minutes.
        Check the control plane's timer and its heartbeat credentials
        (Operations Handbook, Off-worker heartbeat; recipe in
        alerting/docs/infra.md, Control-plane heartbeat).
      Metrics:
        - Id: m1
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: VllmAlerting
              MetricName: Heartbeat
              Dimensions:
                - Name: Job
                  Value: quarantine-actuator-h100
            Period: 300
            Stat: Sum
        - Id: e1
          Expression: FILL(m1, 0)
          Label: Heartbeats per 5 minutes
          ReturnData: true
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - Ref: HeartbeatTopic
      OKActions:
        - Ref: HeartbeatTopic

  HeartbeatQuarantineActuatorB200Alarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${AWS::StackName}-heartbeat-quarantine-actuator-b200
      AlarmDescription: >-
        No completed b200 quarantine actuator poll for at least 15 minutes.
        Check the control plane's timer and its heartbeat credentials
        (Operations Handbook, Off-worker heartbeat; recipe in
        alerting/docs/infra.md, Control-plane heartbeat).
      Metrics:
        - Id: m1
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: VllmAlerting
              MetricName: Heartbeat
              Dimensions:
                - Name: Job
                  Value: quarantine-actuator-b200
            Period: 300
            Stat: Sum
        - Id: e1
          Expression: FILL(m1, 0)
          Label: Heartbeats per 5 minutes
          ReturnData: true
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - Ref: HeartbeatTopic
      OKActions:
        - Ref: HeartbeatTopic

Outputs:
  CheckpointBucketName:
    Value:
      Ref: CheckpointBucket
  WorkerInstanceId:
    Value:
      Ref: WorkerInstance
  HeartbeatTopicArn:
    Value:
      Ref: HeartbeatTopic
